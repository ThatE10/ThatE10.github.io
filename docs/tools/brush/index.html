<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toothbrush timer</title>
<meta name="description" content="A 2-minute toothbrush timer with 15-second steps and soft chimes. Works offline.">
<meta name="theme-color" content="#fdf6f5">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #fdf6f5;
    --text: #3b2d2f;
    --muted: #8a7376;
    --red: #b4555f;
    --line: #e6d4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #221a1b;
      --text: #e9dddf;
      --muted: #a08a8d;
      --red: #d98992;
      --line: #463638;
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: Georgia, "Times New Roman", serif;
    background: var(--bg);
    color: var(--text);
    max-width: 26rem;
    margin: 0 auto;
    padding: 3rem 1.25rem;
    text-align: center;
    line-height: 1.5;
  }

  h1 {
    font-size: 1.3rem;
    font-weight: normal;
    margin: 0 0 0.25rem;
  }

  .sub {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 2.5rem;
  }

  .time {
    font-size: 4rem;
    font-variant-numeric: tabular-nums;
    margin: 0;
  }

  .step {
    color: var(--muted);
    font-size: 0.9rem;
    min-height: 1.4em;
    margin: 0.25rem 0 1.5rem;
  }

  .bar {
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 0 2rem;
    overflow: hidden;
  }
  .bar div {
    height: 100%;
    width: 0;
    background: var(--red);
    transition: width 0.25s linear;
  }

  .zone {
    font-size: 1.15rem;
    min-height: 1.6em;
    margin: 0 0 2rem;
  }

  button {
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    background: none;
    border: 1px solid var(--muted);
    border-radius: 4px;
    padding: 0.5rem 1.5rem;
    margin: 0 0.3rem;
    cursor: pointer;
  }
  button:hover { border-color: var(--red); color: var(--red); }

  .options {
    margin-top: 2rem;
    font-size: 0.9rem;
    color: var(--muted);
  }
  .options label { margin: 0 0.7rem; cursor: pointer; }
  .options input { accent-color: var(--red); }

  .note {
    margin-top: 3rem;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<h1>Toothbrush timer</h1>
<p class="sub">2 minutes, in 15-second steps</p>

<p class="time" id="timeDisplay">2:00</p>
<p class="step" id="stepLabel">&nbsp;</p>

<div class="bar"><div id="barFill"></div></div>

<p class="zone" id="zoneName">&nbsp;</p>

<p>
  <button id="startBtn">Start</button>
  <button id="resetBtn">Reset</button>
</p>

<p class="options">
  <label><input type="checkbox" id="chimeToggle" checked> chime</label>
  <label><input type="checkbox" id="ambientToggle"> background noise</label>
</p>

<p class="note">Works offline once loaded. No files, nothing sent anywhere.</p>

<script>
(function () {
  'use strict';

  var INTERVAL_MS = 15000;
  var STEPS = 8;
  var TOTAL_MS = INTERVAL_MS * STEPS;

  var ZONES = [
    'Upper right, outside',
    'Upper right, inside',
    'Upper left, outside',
    'Upper left, inside',
    'Lower left, outside',
    'Lower left, inside',
    'Lower right, outside',
    'Lower right, inside'
  ];

  var timeDisplay = document.getElementById('timeDisplay');
  var stepLabel   = document.getElementById('stepLabel');
  var zoneName    = document.getElementById('zoneName');
  var startBtn    = document.getElementById('startBtn');
  var resetBtn    = document.getElementById('resetBtn');
  var chimeToggle = document.getElementById('chimeToggle');
  var ambientToggle = document.getElementById('ambientToggle');
  var barFill     = document.getElementById('barFill');

  var running = false;
  var finished = false;
  var elapsedBase = 0;
  var segmentStart = 0;
  var lastStep = -1;
  var rafId = null;

  function elapsedNow() {
    return running ? elapsedBase + (performance.now() - segmentStart) : elapsedBase;
  }

  function fmt(ms) {
    var s = Math.max(0, Math.ceil(ms / 1000));
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  function render() {
    var el = Math.min(elapsedNow(), TOTAL_MS);
    timeDisplay.textContent = fmt(TOTAL_MS - el);
    barFill.style.width = (100 * el / TOTAL_MS) + '%';

    var step = Math.min(Math.floor(el / INTERVAL_MS), STEPS - 1);
    if (running && step !== lastStep) {
      lastStep = step;
      zoneName.textContent = ZONES[step];
      stepLabel.textContent = (step + 1) + ' / ' + STEPS;
      if (step > 0) playChime('step');
    }

    if (el >= TOTAL_MS && running) { complete(); return; }
    if (running) rafId = requestAnimationFrame(render);
  }

  function togglePause() {
    if (running) {
      var el = elapsedNow();
      running = false;
      elapsedBase = el;
      startBtn.textContent = 'Resume';
      stopAmbient();
      releaseWakeLock();
      if (rafId) cancelAnimationFrame(rafId);
    } else {
      if (finished) reset();
      ensureAudio();
      running = true;
      segmentStart = performance.now();
      startBtn.textContent = 'Pause';
      if (elapsedBase === 0) lastStep = -1;
      startAmbient();
      requestWakeLock();
      rafId = requestAnimationFrame(render);
    }
  }

  function complete() {
    running = false;
    finished = true;
    elapsedBase = TOTAL_MS;
    if (rafId) cancelAnimationFrame(rafId);
    timeDisplay.textContent = '0:00';
    barFill.style.width = '100%';
    stepLabel.textContent = '';
    zoneName.textContent = 'Done.';
    startBtn.textContent = 'Start';
    playChime('done');
    stopAmbient(3);
    releaseWakeLock();
  }

  function reset() {
    running = false;
    finished = false;
    elapsedBase = 0;
    lastStep = -1;
    if (rafId) cancelAnimationFrame(rafId);
    startBtn.textContent = 'Start';
    stepLabel.innerHTML = '&nbsp;';
    zoneName.innerHTML = '&nbsp;';
    stopAmbient();
    releaseWakeLock();
    render();
  }

  startBtn.addEventListener('click', togglePause);
  resetBtn.addEventListener('click', reset);

  /* audio: synthesized in the page, no files */
  var ctx = null, master = null, ambient = null;

  function ensureAudio() {
    if (!ctx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.9;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
  }

  function tone(freq, t0, dur, peak) {
    var o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;
    var g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(peak, t0 + 0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g);
    g.connect(master);
    o.start(t0);
    o.stop(t0 + dur + 0.1);
  }

  function playChime(kind) {
    if (!chimeToggle.checked) return;
    ensureAudio();
    if (!ctx) return;
    var t = ctx.currentTime + 0.03;
    if (kind === 'step') {
      tone(523.25, t, 2.2, 0.11);
      tone(1046.50, t, 1.5, 0.035);
    } else if (kind === 'done') {
      tone(523.25, t, 2.5, 0.09);
      tone(659.25, t + 0.35, 2.5, 0.09);
      tone(783.99, t + 0.7, 2.8, 0.09);
    }
  }

  /* quiet pink noise loop for the background-noise option */
  function makePinkNoise() {
    var len = ctx.sampleRate * 4;
    var buf = ctx.createBuffer(1, len, ctx.sampleRate);
    var data = buf.getChannelData(0);
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
    for (var i = 0; i < len; i++) {
      var white = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + white * 0.0555179;
      b1 = 0.99332 * b1 + white * 0.0750759;
      b2 = 0.96900 * b2 + white * 0.1538520;
      b3 = 0.86650 * b3 + white * 0.3104856;
      b4 = 0.55000 * b4 + white * 0.5329522;
      b5 = -0.7616 * b5 - white * 0.0168980;
      data[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.11;
      b6 = white * 0.115926;
    }
    return buf;
  }

  function startAmbient() {
    if (!ambientToggle.checked) return;
    ensureAudio();
    if (!ctx || ambient) return;
    var src = ctx.createBufferSource();
    src.buffer = makePinkNoise();
    src.loop = true;

    var filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 480;
    filter.Q.value = 0.4;

    var gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.05, ctx.currentTime + 2.5);

    var lfo = ctx.createOscillator();
    lfo.type = 'sine';
    lfo.frequency.value = 0.07;
    var lfoGain = ctx.createGain();
    lfoGain.gain.value = 0.02;
    lfo.connect(lfoGain);
    lfoGain.connect(gain.gain);

    src.connect(filter);
    filter.connect(gain);
    gain.connect(master);
    src.start();
    lfo.start();
    ambient = { source: src, gain: gain, lfo: lfo };
  }

  function stopAmbient(fadeSeconds) {
    if (!ambient || !ctx) { ambient = null; return; }
    var fade = typeof fadeSeconds === 'number' ? fadeSeconds : 0.8;
    var a = ambient;
    ambient = null;
    try {
      a.gain.gain.cancelScheduledValues(ctx.currentTime);
      a.gain.gain.setValueAtTime(Math.max(a.gain.gain.value, 0.0001), ctx.currentTime);
      a.gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + fade);
      a.source.stop(ctx.currentTime + fade + 0.1);
      a.lfo.stop(ctx.currentTime + fade + 0.1);
    } catch (e) { /* nodes may already be stopped */ }
  }

  ambientToggle.addEventListener('change', function () {
    if (running) { ambientToggle.checked ? startAmbient() : stopAmbient(); }
  });

  /* keep the screen on while running, where supported */
  var wakeLock = null;
  function requestWakeLock() {
    if (!('wakeLock' in navigator)) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
    }).catch(function () {});
  }
  function releaseWakeLock() {
    if (wakeLock) { wakeLock.release().catch(function () {}); wakeLock = null; }
  }
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && running) requestWakeLock();
  });

  if ('serviceWorker' in navigator &&
      (location.protocol === 'https:' || location.hostname === 'localhost')) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }

  render();
})();
</script>
</body>
</html>
