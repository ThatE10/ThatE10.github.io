# Site settings
title: Ethan Nguyen
tagline: Interpretability research
nook: Ethan's Internet Nook
description: >-
  Ethan Nguyen studies AI internals: weight-based interpretability,
  low-rank training, and honest LLM evaluation, toward safe, scalable,
  and interpretable AI systems.
baseurl: ""
url: "https://e-10.net"
lang: en
github_username: ThatE10
repository: ThatE10/ThatE10.github.io
locale: en_US

# No theme (GitHub Pages would otherwise add Primer): every layout lives in _layouts/, and the stylesheet is inlined
# from _includes/site.css so pages render without a single blocking request.

theme: null

markdown: kramdown
highlighter: rouge
kramdown:
  math_engine: mathjax

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

include:
  - _pages

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/
  - assets/fonts/README.md
  - "**/*.patch"

defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-wolf-pit.jpg
  - scope:
      path: ""
      type: pages
    values:
      layout: page

author:
  name: Ethan Nguyen
  url: "https://e-10.net"
