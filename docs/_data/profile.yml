# Everything the homepage says about Ethan. Inline Markdown is allowed in
# `now`, `education` and `about`.
name: Ethan Nguyen
statement: >-
  I study AI internals. My research explores weight-based interpretability,
  low-rank training, and honest LLM evaluation, with a focus on safe,
  scalable, and interpretable AI systems.
now: >-
  [Pivotal Research](https://www.pivotal-research.org/fellows/ethan-nguyen)
  fellow in weight-based interpretability, mentored by
  [Thomas Dooms](https://tdooms.github.io/) and
  [Logan Riggs](https://scholar.google.com/citations?user=s1C56pIAAAAJ&hl=en)
education: >-
  B.S. 2026, mathematics & computer science, UNC Charlotte · nearly four
  years of research
about: >-
  I graduated from UNC Charlotte in 2026 with a B.S. in mathematics and
  computer science, and have nearly four years of research experience,
  beginning in non-convex optimization with
  [Christian Kümmerle](https://ckuemmerle.com/home/). I am now a
  [Pivotal Research](https://www.pivotal-research.org/fellows/ethan-nguyen)
  fellow working on weight-based interpretability, mentored by
  [Thomas Dooms](https://tdooms.github.io/) and
  [Logan Riggs](https://scholar.google.com/citations?user=s1C56pIAAAAJ&hl=en),
  and chair the advisory board of Charlotte AI Research.
location: Charlotte, NC

